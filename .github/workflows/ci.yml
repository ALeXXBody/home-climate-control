name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hass-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pyflakes aiohttp
      - name: Static analysis (pyflakes)
        run: pyflakes custom_components/home_climate_control/
      - name: Unit + import smoke tests
        run: python -m pytest tests/ -q

  panel-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install jsdom
        run: npm install --no-fund --no-audit jsdom@24
      - name: Syntax check panel JS
        run: node --check custom_components/home_climate_control/www/home-climate-panel.js
      - name: Panel DOM gates (sections unique, flash→ws, notices)
        run: node tests/panel_dom_test.mjs
