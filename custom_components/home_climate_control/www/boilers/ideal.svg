<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="1a3c5e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20262c"/>
      <stop offset="1" stop-color="#0e1215"/>
    </linearGradient>
  </defs>
  <!-- wall plate -->
  <rect x="30" y="10" width="140" height="220" rx="14" fill="url(#body)" stroke="#9aa4ad" stroke-width="2"/>
  <!-- flue -->
  <circle cx="100" cy="30" r="16" fill="#b7c0c8" stroke="#8a939b" stroke-width="2"/>
  <circle cx="100" cy="30" r="8" fill="#5b646c"/>
  <!-- display panel -->
  <rect x="52" y="58" width="96" height="52" rx="8" fill="url(#panel)"/>
  <text x="100" y="80" text-anchor="middle" font-family="monospace" font-size="18" fill="#4fd1c5">52.0</text>
  <text x="100" y="98" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8aa">°C FLOW</text>
  <!-- status leds -->
  <circle cx="66" cy="126" r="5" fill="#48bb78"/>
  <circle cx="84" cy="126" r="5" fill="#f6ad55"/>
  <circle cx="102" cy="126" r="5" fill="#e53e3e"/>
  <!-- knobs -->
  <circle cx="140" cy="126" r="12" fill="#eef1f4" stroke="#9aa4ad" stroke-width="2"/>
  <line x1="140" y1="118" x2="140" y2="124" stroke="#5b646c" stroke-width="2"/>
  <!-- pipes -->
  <rect x="62" y="150" width="18" height="70" rx="4" fill="#aab4bc"/>
  <rect x="120" y="150" width="18" height="70" rx="4" fill="#aab4bc"/>
  <!-- flame icon -->
  <path d="M100 190 c-10 12 -14 18 -14 26 a14 14 0 0 0 28 0 c0-8-4-14-14-26z" fill="#f6ad55" opacity=".85"/>
  <text x="100" y="248" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#8a939b">ideal</text>
</svg>
